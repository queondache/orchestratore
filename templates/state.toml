# Stato credito condiviso tra tutte le sessioni: ~/.orchestratore/state.toml.
# I comandi `credito` e le frasi naturali equivalenti lo aggiornano; ogni cervello lo
# rilegge prima di ogni assegnazione. `peso_precedente` si salva una sola volta quando
# si lascia la modalità normale e non si sovrascrive finché entrambi i runtime tornano ok.

[credito]
cc = "ok"   # ok | esaurito
cx = "ok"   # ok | esaurito
modalita = "normale"   # normale | solo-cc | solo-cx | fermo
aggiornato = "1970-01-01T00:00:00Z"
motivo = "stato iniziale"

# Peso salvato prima dell'ultimo failover. Si ripristina solo quando cc e cx sono entrambi ok.
[credito.peso_precedente]
dev = { cx = 100, cc = 0 }
verifica = "cc"
