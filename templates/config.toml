# Direttore project configuration: copy to .orchestratore/config.toml.
# Every key is optional; missing keys use the runtime defaults.

[engines]
max_parallel = 0         # 0 = no cap: every ready unit goes out, within the runtime's slots
engine = "ask"           # "ask" = the director asks at start | "claude" | "codex" | "mixed" (Claude builds, Codex checks)

[models]
# Use the names your runtime exposes. Builder and verifier must differ.
# Claude: opus for the complex work (coordinator, tier 3 and final verification, diagnostician),
# sonnet builds. Engine mixed: tier 1-2 units are checked by an economical Codex model.
claude_builder = "sonnet"
claude_verifier = "opus"
codex_builder = ""       # "" = the director picks an economical model the session lists
codex_verifier = ""      # strongest model: tier 3 and diagnosis; must differ from codex_builder
codex_unit_verifier = "" # economical model for tier 1-2 unit checks; "" = the director picks one
codex_effort = "medium"
codex_sandbox = "workspace-write"   # codex-task.sh: read-only | workspace-write | danger-full-access

[merge]
# Auto-merge happens only when EVERY changed path matches one of these globs,
# none matches a sensitive glob, the tier is 1-2 and required checks passed.
# Missing key = ["**"] (everything outside the sensitive paths).
# Empty list = auto-merge is off and every PR waits for you.
auto_merge_globs = ["**"]
# Added to the built-in sensitive paths (schema, migrations, auth, payments, tenancy,
# personal/health data, secrets, permissions, deletion). Built-ins cannot be removed.
# Generic names are not built in: add e.g. "**/session/**" if it means login here.
sensitive_globs = []
