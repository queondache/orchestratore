# Peso CC/cx dell'orchestratore.
# Globale: ~/.orchestratore/config.toml. Per progetto: .orchestratore/config.toml (vince).
# Valori interi, dev.cx + dev.cc = 100.

[peso]
dev = { cx = 100, cc = 0 }
verifica = "cc"            # cc | cx | opposto
valido_fino = "2026-10-12" # alla scadenza il cervello chiede il nuovo peso, non lo applica in silenzio

[costo]
strategia = "cheapest-capable"
premium_solo_con_trigger = true # Astra/Opus/high: KO, disaccordo, ambiguità o rischio emerso

[parallelismo]
# auto viene risolto in milestone|bugfix prima del primo dispatch e non entra mai nel RUN.
work_profile = "auto"     # auto | milestone | bugfix
builder_milestone = 5
builder_bugfix = 15
review_ogni_builder = 3   # capacità = ceil(builder della wave / 3), mai 0 con review pendenti
review_milestone = 2      # cap; reviewer fuori quota builder
review_bugfix = 5         # cap; reviewer fuori quota builder

[tetti]
domande_aperte = 8

[rischio]
# Un diff che tocca queste aree non va mai in auto-merge: resta PR in attesa di Andrea.
# Glob relativi alla radice del progetto. Assente = default di references/verifica.md.
aree_sensibili = [
  "**/migrations/**", "**/schema*", "**/auth/**", "**/payments/**",
  "**/billing/**", "**/users/**", "**/roles/**", "**/*secret*", "**/*.env*",
]
